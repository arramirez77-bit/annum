# M7: Settings shows the shared count and the connection; a connection that needs signing in
# again shows on Today and in Settings, and Reconnect repairs it through Plaid Link's update mode
# (straight to that bank's sign-in, no bank list): "up to date again", no new connection used.
appId: com.highdesert.annum
name: Bank 2 · settings and reconnect
---
- stopApp
- openLink: 'exp+annum://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8082'
- extendedWaitUntil:
    visible:
      id: 'today'
    timeout: 30000
- tapOn:
    id: 'open-settings'
- scrollUntilVisible:
    element:
      id: 'settings-bank-count'
    direction: DOWN
- assertVisible: '[0-9]+ of 10 bank logins left\. Refreshing a bank you already connected doesn’t use one\..*'
# The bank's card sits above its accounts (the Sandbox bank has seven).
- scrollUntilVisible:
    element:
      id: 'settings-bank-0'
    direction: UP
    centerElement: true
- assertVisible: 'First Platypus Bank \(test\), Connected · synced .*'
- takeScreenshot: m7-settings
- runFlow: ../common/go-back.yaml
# Development: make the Sandbox bank ask to sign in again.
- longPressOn:
    id: 'status-pill'
- scrollUntilVisible:
    element:
      id: 'dev-break-bank'
    direction: DOWN
- tapOn:
    id: 'dev-break-bank'
- extendedWaitUntil:
    visible:
      id: 'bank-note'
    timeout: 60000
- assertVisible: '.*First Platypus Bank needs you to sign in again\. Reconnect it in Settings; it won’t use a new connection\.'
- takeScreenshot: m7-needs-reauth
- tapOn:
    id: 'open-settings'
- scrollUntilVisible:
    element:
      id: 'settings-bank-0'
    direction: DOWN
# Rows read name, value, detail (VoiceOver): 'First Platypus Bank (test), Reconnect, Needs you…'
- assertVisible: 'First Platypus Bank \(test\), Reconnect, Needs you to sign in again'
- tapOn:
    id: 'settings-bank-0'
- extendedWaitUntil:
    visible: 'Sign in to First Platypus Bank again'
    timeout: 30000
- assertVisible: 'This repairs your connection in place\. It doesn’t use a new one\.'
- takeScreenshot: m7-reconnect
- tapOn:
    id: 'connect-go'
# Plaid Link, update mode: this bank's sign-in again (the Sandbox user from flow 1).
- extendedWaitUntil:
    visible: 'Continue without phone number|Log into First Platypus Bank'
    timeout: 30000
- runFlow:
    when:
      visible: 'Continue without phone number'
    commands:
      - tapOn: 'Continue without phone number'
- extendedWaitUntil:
    visible: 'Log into First Platypus Bank'
    timeout: 20000
- tapOn: 'Username'
- inputText: 'user_transactions_dynamic'
- tapOn: 'Password'
- inputText: 'pass_good'
- runFlow:
    when:
      visible: 'Done'
    commands:
      - tapOn: 'Done'
- tapOn: 'Submit'
- extendedWaitUntil:
    visible: 'Your accounts'
    timeout: 30000
- tapOn: 'Continue'
- extendedWaitUntil:
    visible: 'Finish without saving'
    timeout: 30000
- tapOn: 'Finish without saving'
# Back in Annum
- extendedWaitUntil:
    visible: 'First Platypus Bank is up to date again'
    timeout: 60000
- assertVisible: 'Your connection was repaired\. No new connection was used\.'
- takeScreenshot: m7-repaired
- tapOn:
    id: 'connect-done'
- scrollUntilVisible:
    element:
      id: 'settings-bank-0'
    direction: DOWN
- assertVisible: 'First Platypus Bank \(test\), Connected · synced .*'
- scrollUntilVisible:
    element:
      id: 'settings-bank-count'
    direction: DOWN
- assertVisible: '[0-9]+ of 10 bank logins left\. Refreshing a bank you already connected doesn’t use one\..*'
