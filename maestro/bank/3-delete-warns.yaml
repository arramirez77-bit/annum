# M7: with a bank connected, Delete everything says the bank logins stay open at Plaid (so a
# backup brings them back for free) and offers ending them at Plaid (off by default). This flow cancels: it deletes nothing.
appId: com.highdesert.annum
name: Bank 3 · delete everything warns
---
- stopApp
- openLink: 'exp+annum://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8082'
- extendedWaitUntil:
    visible:
      id: 'today'
    timeout: 30000
- tapOn:
    id: 'open-settings'
- scrollUntilVisible:
    element:
      id: 'privacy-delete'
    direction: DOWN
- tapOn:
    id: 'privacy-delete'
- extendedWaitUntil:
    visible:
      id: 'delete-banks-note'
    timeout: 10000
- assertVisible: 'Your bank logins stay open at Plaid, so a backup can bring them back without using any of your 10\.'
- assertVisible: 'Accounts and balances, [0-9]+, Bank logins stay open at Plaid'
- scrollUntilVisible:
    element:
      id: 'delete-end-at-plaid'
    direction: DOWN
- assertVisible: 'End my bank logins at Plaid too.*'
- takeScreenshot: m7-delete
- tapOn:
    id: 'delete-cancel'
