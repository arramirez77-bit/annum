# Opens Annum (Metro on :8082) before scripts/maestro-bank.sh sends the pairing link, then the
# Pair screen itself, as after Settings → "Scan a new access code": the code then arrives on a
# Pair screen that's already open, and must still be taken (code review #8).
appId: com.highdesert.annum
name: Bank · open the app
---
- stopApp
- openLink: 'exp+annum://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8082'
- extendedWaitUntil:
    visible:
      id: 'welcome|today|onboarding-.*'
    timeout: 30000
- openLink: 'annum://pair'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'pair'
    timeout: 15000
