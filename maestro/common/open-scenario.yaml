# Opens Annum on Today (Metro on :8082) and switches to ${SCENARIO} via the status pill.
appId: com.highdesert.annum
---
- stopApp
- openLink: 'exp+annum://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8082'
- extendedWaitUntil:
    visible:
      id: 'status-pill'
    timeout: 30000
- longPressOn:
    id: 'status-pill'
- tapOn:
    id: 'scenario-${SCENARIO}'
- extendedWaitUntil:
    visible:
      id: 'today'
    timeout: 10000
