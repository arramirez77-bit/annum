# M4: first run — quick setup (O6), then the first split of unsplit savings.
appId: com.highdesert.annum
name: First split
---
- runFlow:
    file: common/open-scenario.yaml
    env:
      SCENARIO: first-run
- tapOn: 'Money'
- tapOn:
    id: 'split-now'
- extendedWaitUntil:
    visible: 'Before we split your savings'
    timeout: 8000
- assertVisible: 'Two quick choices\. You can change both later in Settings\.'
- assertVisible: '\$4,500 goes to taxes\. Your Runway target becomes \$15,000\. \$12,600 of your savings goes toward it\.'
- tapOn:
    id: 'setup-continue'
- extendedWaitUntil:
    visible: '\$19,100 in savings'
    timeout: 8000
- scrollUntilVisible:
    element:
      id: 'deposit-confirm'
    direction: DOWN
- tapOn:
    id: 'deposit-confirm'
- extendedWaitUntil:
    visible: 'Taxes, \$4,500\. .*'
    timeout: 8000
- assertVisible: 'Runway, \$12,600\. .*'
- assertNotVisible:
    id: 'split-now'
