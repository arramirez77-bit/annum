appId: com.highdesert.annum
name: Scenario on-track
---
- runFlow:
    file: ../common/open-scenario.yaml
    env:
      SCENARIO: on-track
- extendedWaitUntil:
    visible: 'You can spend \$1,000 until your next invoice on Oct 13\. About \$50 a day\.'
    timeout: 5000
- assertVisible: 'Status: On track'
- assertVisible: 'Runway, 4\.2 months, Up 0\.2 months this week · target 5 months'
- assertVisible: 'Taxes, \$3,000, Next payment Jan 15'
- assertVisible: 'What would this do\?, Try a purchase before you buy it'
- assertVisible: 'Start weekly review'
- takeScreenshot: scenario-on-track
# The settings button opens Settings (S3).
- tapOn:
    id: 'open-settings'
- assertVisible: 'Set aside for taxes, 30%'
- assertVisible: 'Runway target, \$15,000 · 5 months'
