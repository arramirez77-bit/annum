appId: com.highdesert.annum
name: Scenario stale-sync
---
- runFlow:
    file: ../common/open-scenario.yaml
    env:
      SCENARIO: stale-sync
- extendedWaitUntil:
    visible: 'You can spend about \$1,000 until your next invoice on Oct 13\. About \$50 a day\.'
    timeout: 5000
- assertVisible: 'Updated Sep 20'
- assertVisible: 'Heads up\. Woodgrove hasn’t synced since Sep 20, so this may be off by a few purchases\. Tap to reconnect\.'
- assertNotVisible:
    id: 'today-row-what-if'
- assertVisible: 'Status: On track'
- takeScreenshot: scenario-stale-sync
