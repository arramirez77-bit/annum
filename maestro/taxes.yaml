# M4: Taxes totals and the accountant CSV export (share sheet opens). M7: Today's Tax reserve
# row opens Taxes too.
appId: com.highdesert.annum
name: Taxes export
---
- runFlow:
    file: common/open-scenario.yaml
    env:
      SCENARIO: on-track
- scrollUntilVisible:
    element:
      id: 'today-row-tax'
    direction: DOWN
- tapOn:
    id: 'today-row-tax'
- extendedWaitUntil:
    visible: '\$3,800 in work expenses tagged this year\. Your accountant gets this list, sorted\.'
    timeout: 5000
- runFlow: common/go-back.yaml
- tapOn: 'Money'
- scrollUntilVisible:
    element:
      id: 'open-taxes'
    direction: DOWN
- tapOn:
    id: 'open-taxes'
- extendedWaitUntil:
    visible: '\$3,800 in work expenses tagged this year\. Your accountant gets this list, sorted\.'
    timeout: 5000
- assertVisible: 'Equipment, \$2,000, 3 items'
- assertVisible: 'Taxes, \$3,000, Next quarterly payment Jan 15'
- tapOn:
    id: 'export-csv'
- extendedWaitUntil:
    visible: '.*annum-work-expenses-2026.*'
    timeout: 10000
- takeScreenshot: taxes-share-sheet
