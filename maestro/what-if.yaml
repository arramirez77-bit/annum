appId: com.highdesert.annum
name: What would this do?
---
- runFlow:
    file: common/open-scenario.yaml
    env:
      SCENARIO: on-track
- tapOn: 'What would this do\?'
- extendedWaitUntil:
    visible:
      id: 'what-if-amount'
    timeout: 5000
- inputText: '200'
- extendedWaitUntil:
    visible: 'Free to spend, \$800'
    timeout: 3000
- assertVisible: 'Per day, \$40'
- assertVisible: 'Runway, 4\.2 mo'
- assertVisible: "That fits\\. You'd still have about \\$40 a day until Oct 13\\."
- takeScreenshot: what-if-fits
- eraseText: 10
- inputText: '2000'
- extendedWaitUntil:
    visible: 'Runway, 3\.9 mo'
    timeout: 3000
- assertVisible: 'Free to spend, \$0'
- assertVisible: 'Heads up\. This would dip \$1,000 into Runway \(4\.2 → 3\.9 months\)\. Waiting until Oct 13, when your invoice arrives, keeps Runway whole\.'
- takeScreenshot: what-if-guardrail
# A short upward drag inside the page dismisses the number pad (keyboardDismissMode on-drag).
# A downward swipe would close the modal instead.
- swipe:
    start: 50%, 45%
    end: 50%, 30%
- tapOn: 'Wait until Oct 13'
- extendedWaitUntil:
    visible:
      id: 'today'
    timeout: 5000
