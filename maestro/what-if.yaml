appId: com.highdesert.annum
name: What would this do?
---
- runFlow:
    file: common/open-scenario.yaml
    env:
      SCENARIO: on-track
- tapOn: 'What would this do\?.*'
- extendedWaitUntil:
    visible:
      id: 'what-if-amount'
    timeout: 5000
- inputText: '200'
- extendedWaitUntil:
    visible: 'Free to spend, \$800, Was \$1,000'
    timeout: 3000
- assertVisible: 'Per day until Oct 13, \$40, Was \$50'
- assertVisible: 'Runway, 4\.2 months, Unchanged'
- assertVisible: 'This fits\. It comes out of Free, and your savings stay where they are\.'
- takeScreenshot: what-if-fits
- eraseText: 10
- inputText: '2000'
- extendedWaitUntil:
    visible: 'Runway, 3\.9 months, The rest would come from savings'
    timeout: 3000
- assertVisible: 'Free to spend, \$0, Was \$1,000'
- assertVisible: 'Your Runway target, 5 months, \$15,000'
- assertVisible: 'Heads up\. This would take \$1,000 out of Runway\. Your invoice lands Oct 13, and if you wait until then, your savings stay whole\. We’ll ask you again when it lands\.'
- takeScreenshot: what-if-guardrail
# Tapping plain text closes the number pad (see deposit.yaml).
- tapOn: 'If I spend'
- tapOn: 'Wait until Oct 13'
- extendedWaitUntil:
    visible:
      id: 'today'
    timeout: 5000
